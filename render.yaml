# Render blueprint for the match server (https://render.com/docs/blueprint-spec).
# The free plan sleeps after about 15 minutes with nobody connected and takes around a
# minute to wake; the client knocks on the health endpoint and waits, saying so.
services:
  - type: web
    name: wobble-wars-server
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build:server
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
